services:
  # ==============================================================================
  # 1. BANCO DE DADOS (POSTGRESQL 17)
  # ==============================================================================
  database:
    image: postgres:17-alpine
    container_name: kyly_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}      
      - TZ=America/Sao_Paulo      
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - supergestao-network
    command: 
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "logging_collector=on"
      - "-c"
      - "timezone=America/Sao_Paulo" 
      - "-c"
      - "log_timezone=America/Sao_Paulo"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # 2. BACKEND API (.NET 10)
  # ==============================================================================
  backend:
    build:
      context: .
      dockerfile: src/banckend/Dockerfile
    container_name: kyly_backend
    restart: always
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=database;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_USER=${ADMIN_USER}
      - DIRETORIO_ARQUIVO=${DIRETORIO_ARQUIVO}
    ports:
      - "8080:8080"
    networks:
      - supergestao-network
    depends_on:
      database:
        condition: service_healthy

  # ==============================================================================
  # 3. FRONTEND (ANGULAR / NGINX)
  # ==============================================================================
  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: kyly_frontend
    restart: always
    ports:
      - "80:80"
    networks:
      - supergestao-network
    depends_on:
      - backend

# ==============================================================================
# DEFINIÇÕES DE REDE E VOLUMES
# ==============================================================================
networks:
  supergestao-network:
    driver: bridge

volumes:
  postgres_data: